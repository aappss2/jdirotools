<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geo Tag Camera with Location Name – JDIRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Advanced Geo Tag Camera by JDIRO with EXIF GPS metadata and full location name including village, city, state, and country.">
<meta name="keywords" content="geo tag camera location name, gps photo with address, exif gps camera online">
<meta name="author" content="JDIRO">

<!-- AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8977523182593956"
     crossorigin="anonymous"></script>

<!-- EXIF -->
<script src="https://cdn.jsdelivr.net/npm/piexifjs"></script>

<style>
:root{
  --bg:#020617;
  --panel:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.12);
  --accent:#5b8cff;
  --hot1:#ef4444;
  --hot2:#f97316;
  --text:#e5e7eb;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:linear-gradient(180deg,#020617,#05070d);
  color:var(--text);
}
header{
  height:110px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 26px;
}
.brand{display:flex;gap:14px;align-items:center}
.brand h1{color:var(--accent);margin:0}
nav a{
  color:#dbeafe;
  text-decoration:none;
  margin-left:14px;
  font-weight:600;
}
main{max-width:1100px;margin:auto;padding:20px}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  backdrop-filter:blur(12px);
}
video,canvas{width:100%;border-radius:16px}
.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-top:14px;
}
button{
  padding:12px;
  border-radius:14px;
  border:none;
  font-weight:700;
  background:linear-gradient(90deg,var(--hot1),var(--hot2));
  color:#fff;
}
.status{
  margin-top:12px;
  font-size:.9rem;
  opacity:.9;
}
footer{margin-top:40px}
</style>
</head>

<body>

<header>
  <div class="brand">
    <h1>🛠 JIRO</h1>
  </div>
  <nav>
    <a href="https://jdiro.com/">Home</a>
    <a href="https://jdiro.com/privacy-policy.html">Privacy</a>
    <a href="https://jdiro.com/terms.html">Terms</a>
  </nav>
</header>

<main>
  <h2>📍 Geo-Tag Camera with Location Name</h2>
  <p>Captures photo with <b>EXIF GPS</b> and <b>Place, Village, City, State, Country</b>.</p>

  <div class="card">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" hidden></canvas>

    <div class="controls">
      <button onclick="capture()">📸 Capture</button>
      <button onclick="downloadImage()">⬇ Download</button>
    </div>

    <div class="status" id="status">Initializing GPS…</div>
  </div>

  <footer>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-format="autorelaxed"
         data-ad-client="ca-pub-8977523182593956"
         data-ad-slot="2636907907"></ins>
    <script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
  </footer>
</main>

<script>
let stream, lat=0, lng=0;
let locationText="Location unavailable";
let finalImage="";

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const statusEl=document.getElementById("status");

navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false})
.then(s=>{stream=s;video.srcObject=s});

navigator.geolocation.getCurrentPosition(async p=>{
  lat=p.coords.latitude;
  lng=p.coords.longitude;
  statusEl.textContent="Fetching location name…";
  await reverseGeocode();
},()=>statusEl.textContent="GPS permission denied");

async function reverseGeocode(){
  try{
    const res=await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`,
      {headers:{'Accept':'application/json'}}
    );
    const data=await res.json();
    const a=data.address||{};
    locationText=[
      a.village||a.town||a.city||"",
      a.state||"",
      a.country||""
    ].filter(Boolean).join(", ");
    statusEl.textContent="📍 "+locationText;
  }catch{
    statusEl.textContent="Location name unavailable";
  }
}

function degToDms(v){
  const a=Math.abs(v);
  const d=Math.floor(a);
  const m=Math.floor((a-d)*60);
  const s=((a-d-m/60)*3600);
  return [[d,1],[m,1],[Math.round(s*100),100]];
}

function capture(){
  canvas.hidden=false;
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const c=canvas.getContext("2d");
  c.drawImage(video,0,0);

  c.fillStyle="rgba(0,0,0,.6)";
  c.fillRect(0,canvas.height-120,canvas.width,120);
  c.fillStyle="#fff";
  c.font="18px sans-serif";
  c.fillText(locationText,20,canvas.height-70);
  c.fillText(`Lat ${lat.toFixed(6)}, Lng ${lng.toFixed(6)}`,20,canvas.height-40);
  c.fillText(new Date().toLocaleString(),20,canvas.height-15);

  let jpeg=canvas.toDataURL("image/jpeg",0.95);

  const gps={};
  gps[piexif.GPSIFD.GPSLatitudeRef]=lat>=0?"N":"S";
  gps[piexif.GPSIFD.GPSLatitude]=degToDms(lat);
  gps[piexif.GPSIFD.GPSLongitudeRef]=lng>=0?"E":"W";
  gps[piexif.GPSIFD.GPSLongitude]=degToDms(lng);

  finalImage=piexif.insert(piexif.dump({GPS:gps}),jpeg);
  statusEl.textContent="✅ Photo captured with GPS & location name";
}

function downloadImage(){
  if(!finalImage){alert("Capture first");return;}
  const a=document.createElement("a");
  a.href=finalImage;
  a.download="geo-tagged-photo.jpg";
  a.click();
}
</script>

</body>
</html>
