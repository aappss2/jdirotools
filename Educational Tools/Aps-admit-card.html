<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal School Admit Card System</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
@media print {
  .no-print { display:none }
  @page { size:A4; margin:10mm }
}
.admit-card{
  max-width:190mm;
  border:2px solid #000;
  padding:14px;
  margin:10px auto;
  page-break-inside:avoid;
}
</style>
</head>

<body class="bg-gray-100 p-4">

<!-- ================= SCHOOL SETTINGS ================= -->
<div class="no-print bg-white p-4 rounded shadow mb-4">
<h2 class="text-xl font-bold mb-3">🏫 School Settings</h2>

<div class="grid md:grid-cols-2 gap-3">
<input id="schoolName" placeholder="School Name" class="border p-2">
<input id="schoolAddress" placeholder="School Address" class="border p-2">
<input id="schoolMobile" placeholder="Mobile" class="border p-2">
<input id="schoolEmail" placeholder="Email" class="border p-2">
<input id="examTitle" placeholder="Exam Title (e.g. December Exam 2025)" class="border p-2">
<input type="file" id="schoolLogo" accept="image/*" class="border p-2">
</div>

<button onclick="saveSchool()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded">Save School Info</button>
</div>

<!-- ================= DATE SHEET ================= -->
<div class="no-print bg-white p-4 rounded shadow mb-4">
<h2 class="text-xl font-bold mb-3">📅 Date Sheet Manager</h2>

<div class="flex gap-2 mb-2">
<input id="dsClass" placeholder="Class" class="border p-2">
<input id="dsDate" type="date" class="border p-2">
<input id="dsSubject" placeholder="Subject" class="border p-2">
<input id="dsTime" placeholder="Time" class="border p-2">
<button onclick="addDateRow()" class="bg-green-600 text-white px-3 rounded">Add</button>
</div>

<input type="file" accept=".xlsx" onchange="uploadDateSheet(event)" class="mb-2">

<button onclick="downloadDateSheet()" class="bg-indigo-600 text-white px-3 py-1 rounded">Download Date Sheet Excel</button>

<table class="w-full mt-3 border text-sm">
<thead class="bg-gray-200">
<tr><th>Class</th><th>Date</th><th>Subject</th><th>Time</th></tr>
</thead>
<tbody id="dateTable"></tbody>
</table>
</div>

<!-- ================= STUDENT ENTRY ================= -->
<div class="no-print bg-white p-4 rounded shadow mb-4">
<h2 class="text-xl font-bold mb-3">🎓 Student Entry</h2>

<div class="grid md:grid-cols-4 gap-2">
<input id="sRoll" placeholder="Roll No" class="border p-2">
<input id="sClass" placeholder="Class" class="border p-2">
<input id="sName" placeholder="Student Name" class="border p-2">
<input id="sFather" placeholder="Father Name" class="border p-2">
</div>

<button onclick="generateSingle()" class="mt-3 bg-blue-700 text-white px-4 py-2 rounded">
Generate Admit Card
</button>

<input type="file" accept=".xlsx" onchange="uploadStudents(event)" class="mt-3">
</div>

<!-- ================= PRINT ================= -->
<div class="no-print text-right mb-4">
<button onclick="window.print()" class="bg-black text-white px-4 py-2 rounded">🖨 Print</button>
</div>

<!-- ================= OUTPUT ================= -->
<div id="cards"></div>

<script>
let school={}, dates=[], logoData="";

function saveSchool(){
 school={
  name:schoolName.value,
  addr:schoolAddress.value,
  mob:schoolMobile.value,
  mail:schoolEmail.value,
  exam:examTitle.value
 };
 localStorage.school=JSON.stringify(school);
}

schoolLogo.onchange=e=>{
 let r=new FileReader();
 r.onload=()=>logoData=r.result;
 r.readAsDataURL(e.target.files[0]);
}

function addDateRow(){
 dates.push({
  class:dsClass.value,
  date:dsDate.value,
  subject:dsSubject.value,
  time:dsTime.value
 });
 renderDates();
}

function renderDates(){
 dateTable.innerHTML="";
 dates.forEach(d=>{
  dateTable.innerHTML+=`<tr class="border">
  <td>${d.class}</td><td>${d.date}</td><td>${d.subject}</td><td>${d.time}</td></tr>`;
 });
 localStorage.dates=JSON.stringify(dates);
}

function uploadDateSheet(e){
 let r=new FileReader();
 r.onload=()=>{
  let wb=XLSX.read(r.result,{type:'binary'});
  let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  dates=rows.map(r=>({
   class:r.Class,date:r.Date,subject:r.Subject,time:r.Time
  }));
  renderDates();
 };
 r.readAsBinaryString(e.target.files[0]);
}

function downloadDateSheet(){
 let ws=XLSX.utils.json_to_sheet(dates);
 let wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,"DateSheet");
 XLSX.writeFile(wb,"datesheet.xlsx");
}

function getDateSheet(cls){
 return dates.filter(d=>d.class==cls);
}

function generateSingle(stu){
 let s={
  roll:sRoll.value,
  class:sClass.value,
  name:sName.value,
  father:sFather.value
 };
 renderCard(s);
}

function uploadStudents(e){
 let r=new FileReader();
 r.onload=()=>{
  let wb=XLSX.read(r.result,{type:'binary'});
  let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  rows.forEach(r=>renderCard({
   roll:r["Roll No"]||"",
   class:r.Class,
   name:r.Name,
   father:r["Father Name"]
  }));
 };
 r.readAsBinaryString(e.target.files[0]);
}

function renderCard(s){
 let ds=getDateSheet(s.class);
 let rows=ds.map(d=>`<tr><td>${d.date}</td><td>${d.subject}</td><td>${d.time}</td></tr>`).join("");

 cards.innerHTML+=`
 <div class="admit-card bg-white">
 ${logoData?`<img src="${logoData}" class="w-20 mx-auto">`:""}
 <h2 class="text-center font-bold">${school.name}</h2>
 <p class="text-center text-sm">${school.addr}</p>
 <p class="text-center text-sm">${school.mob} | ${school.mail}</p>
 <h3 class="text-center font-semibold mt-2">${school.exam}</h3>

 <p><b>Roll:</b> ${s.roll} | <b>Class:</b> ${s.class}</p>
 <p><b>Name:</b> ${s.name}</p>
 <p><b>Father:</b> ${s.father}</p>

 <table class="w-full border text-sm mt-2">
 <tr class="bg-gray-200"><th>Date</th><th>Subject</th><th>Time</th></tr>
 ${rows}
 </table>

 <div class="flex justify-between mt-6 text-sm">
 <span>Class Incharge</span><span>Coordinator</span><span>Principal</span>
 </div>
 </div>`;
}

if(localStorage.school) school=JSON.parse(localStorage.school);
if(localStorage.dates) dates=JSON.parse(localStorage.dates),renderDates();
</script>

</body>
</html>
