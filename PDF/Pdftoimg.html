<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to Image Converter</title>
<style>
    body {
            margin: 0;
                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                            background: linear-gradient(135deg, #ff4b1f, #1fddff);
                                    display: flex;
                                            justify-content: center;
                                                    align-items: center;
                                                            height: 100vh;
                                                                    color: white;
                                                                        }
                                                                            .container {
                                                                                    background: rgba(255, 255, 255, 0.15);
                                                                                            padding: 30px;
                                                                                                    border-radius: 20px;
                                                                                                            text-align: center;
                                                                                                                    width: 90%;
                                                                                                                            max-width: 500px;
                                                                                                                                    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
                                                                                                                                            backdrop-filter: blur(10px);
                                                                                                                                                }
                                                                                                                                                    h2 {
                                                                                                                                                            margin-bottom: 15px;
                                                                                                                                                                }
                                                                                                                                                                    .upload-box {
                                                                                                                                                                            border: 2px dashed #fff;
                                                                                                                                                                                    padding: 20px;
                                                                                                                                                                                            border-radius: 15px;
                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                            transition: background 0.3s ease;
                                                                                                                                                                                                                }
                                                                                                                                                                                                                    .upload-box:hover {
                                                                                                                                                                                                                            background: rgba(255, 255, 255, 0.1);
                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                    input[type=file] {
                                                                                                                                                                                                                                            display: none;
                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                    .btn {
                                                                                                                                                                                                                                                            background: #ff9800;
                                                                                                                                                                                                                                                                    color: white;
                                                                                                                                                                                                                                                                            border: none;
                                                                                                                                                                                                                                                                                    padding: 12px 25px;
                                                                                                                                                                                                                                                                                            margin-top: 15px;
                                                                                                                                                                                                                                                                                                    border-radius: 50px;
                                                                                                                                                                                                                                                                                                            font-size: 16px;
                                                                                                                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                                                                                                                            transition: background 0.3s ease, transform 0.2s ease;
                                                                                                                                                                                                                                                                                                                                    display: inline-block;
                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                            .btn:hover {
                                                                                                                                                                                                                                                                                                                                                    background: #e68a00;
                                                                                                                                                                                                                                                                                                                                                            transform: translateY(-2px);
                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                    .preview {
                                                                                                                                                                                                                                                                                                                                                                            margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                                                                                                                                                                                            flex-direction: column;
                                                                                                                                                                                                                                                                                                                                                                                                    gap: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                            align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                    .preview img {
                                                                                                                                                                                                                                                                                                                                                                                                                            max-width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                            border: 2px solid white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>🖼 PDF to Image Converter</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="pdfInput" class="upload-box" id="dropZone">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                Drag & Drop PDF here or <br><b>Click to Select</b>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="file" id="pdfInput" accept="application/pdf">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="preview" id="preview"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="btn" id="downloadAllBtn" style="display:none;">Download All as ZIP</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Libraries -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.7.107/pdf.min.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const pdfInput = document.getElementById('pdfInput');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const preview = document.getElementById('preview');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const dropZone = document.getElementById('dropZone');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const downloadAllBtn = document.getElementById('downloadAllBtn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let imageFiles = [];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Drag & Drop
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            dropZone.addEventListener('dragover', (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            dropZone.style.background = 'rgba(255,255,255,0.2)';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    dropZone.addEventListener('dragleave', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            dropZone.style.background = 'transparent';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    dropZone.addEventListener('drop', (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            e.preventDefault();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    dropZone.style.background = 'transparent';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            pdfInput.files = e.dataTransfer.files;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    handlePDF();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // File selection
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                pdfInput.addEventListener('change', handlePDF);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function handlePDF() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            preview.innerHTML = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    imageFiles = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const file = pdfInput.files[0];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!file) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert("Please select a PDF file.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const fileReader = new FileReader();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fileReader.onload = async function() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const typedArray = new Uint8Array(this.result);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const pdf = await pdfjsLib.getDocument(typedArray).promise;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const page = await pdf.getPage(pageNum);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const viewport = page.getViewport({ scale: 2 });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const canvas = document.createElement('canvas');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const context = canvas.getContext('2d');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                canvas.height = viewport.height;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                canvas.width = viewport.width;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await page.render({ canvasContext: context, viewport: viewport }).promise;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const imgData = canvas.toDataURL('image/png');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                imageFiles.push({ name: `page-${pageNum}.png`, data: imgData });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const img = document.createElement('img');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                img.src = imgData;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                preview.appendChild(img);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Download button for each image
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const downloadBtn = document.createElement('a');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                downloadBtn.textContent = `Download Page ${pageNum}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                downloadBtn.href = imgData;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                downloadBtn.download = `page-${pageNum}.png`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                downloadBtn.className = 'btn';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                preview.appendChild(downloadBtn);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        downloadAllBtn.style.display = 'inline-block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        fileReader.readAsArrayBuffer(file);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Download all as ZIP
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    downloadAllBtn.addEventListener('click', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (imageFiles.length === 0) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const zip = new JSZip();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            imageFiles.forEach(file => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const base64Data = file.data.split(',')[1];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    zip.file(file.name, base64Data, { base64: true });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    zip.generateAsync({ type: 'blob' }).then(content => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                saveAs(content, 'pdf_images.zip');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
