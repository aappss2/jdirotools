<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Keyword Research Tool | J1RO Tools</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A free and powerful keyword research tool from J1RO to generate hundreds of keyword ideas, questions, and long-tail variations from a single seed keyword." />
  <meta name="theme-color" content="#0e0f12" />
  <!-- Three.js CDN -->
  <script src="https://unpkg.com/three@0.156.0/build/three.min.js" defer></script>
  <style>
    :root{
      --bg:#0e0f12;
      --panel:#0f1720;
      --muted:#94a3b8;
      --accent:#5b8cff;
      --accent-2:#60a5fa;
      --hot1:#ef4444;
      --hot2:#f97316;
      --glass: rgba(255,255,255,0.04);
      --glass-2: rgba(91,140,255,0.06);
      --shadow: 0 10px 30px rgba(2,6,23,0.7);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 500px at 10% 10%, rgba(91,140,255,0.06), transparent),
                  linear-gradient(180deg, #07070a 0%, #0e0f12 100%);
      color:#e6eef8;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x: hidden;
    }
    header{
      position:relative;
      height:120px;
      min-height:96px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 28px;
      gap:20px;
      z-index:5;
      isolation:isolate;
    }
    .brand{ display:flex; align-items:center; gap:14px; }
    .canvas-wrap{
      width:86px;
      height:86px;
      border-radius:18px;
      padding:6px;
      background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: var(--shadow);
      display:grid;
      place-items:center;
      backdrop-filter: blur(6px) saturate(120%);
      -webkit-backdrop-filter: blur(6px) saturate(120%);
      border: 1px solid rgba(255,255,255,0.03);
    }
    canvas{display:block; width:100%; height:100%; border-radius:12px; }
    .brand h1{
      font-size:1.15rem;
      margin:0;
      color:var(--accent);
      letter-spacing:0.6px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .brand h1 .logo-emoji { filter:drop-shadow(0 6px 18px rgba(91,140,255,0.12)); }
    nav{ display:flex; gap:16px; align-items:center; }
    nav a{
      color:#dbe9ff;
      text-decoration:none;
      font-weight:600;
      padding:8px 12px;
      border-radius:10px;
      transition:all .18s ease;
      outline: none;
    }
    nav a:focus{ box-shadow: 0 6px 20px rgba(91,140,255,0.12); transform: translateY(-2px); }
    nav a:hover{ color:var(--accent-2); transform: translateY(-3px); }
    .cta{
      background: linear-gradient(90deg,var(--hot1), var(--hot2));
      padding:8px 14px;
      border-radius:12px;
      color:#fff;
      font-weight:700;
      box-shadow: 0 8px 30px rgba(249,115,22,0.12);
    }
    main{
      display:flex;
      justify-content:center;
      padding:36px 20px 80px;
      gap:28px;
    }
    .content{ width:100%; max-width:960px; perspective: 1200px; transform-style: preserve-3d; }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:16px;
      padding:32px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(91,140,255,0.06);
      transform-origin:center;
      transition: transform 0.18s ease, box-shadow .18s ease;
      will-change: transform;
      backdrop-filter: blur(8px) saturate(130%);
    }
    .card:hover{ box-shadow: 0 25px 60px rgba(2,6,23,0.85); }
    h1,h2,h3{ color:var(--accent); margin-top:4px; }
    h1{ font-size:1.8rem; margin-bottom:12px; }
    p{ color: #cfe3ff; margin-bottom:12px; line-height:1.6 }
    .bg-shape{
      position:fixed;
      top:-8%;
      right:-10%;
      width:480px;
      height:480px;
      pointer-events:none;
      background: radial-gradient(circle at 30% 30%, rgba(91,140,255,0.12), transparent 25%),
                  conic-gradient(from 180deg at 50% 50%, rgba(96,165,250,0.06), transparent);
      filter: blur(56px);
      transform: rotate(14deg);
      z-index:0;
    }
    .bg-shape-2{
      position:fixed;
      bottom:-6%;
      left:-10%;
      width:420px;
      height:420px;
      pointer-events:none;
      background: radial-gradient(circle at 60% 60%, rgba(99,102,241,0.06), transparent 25%);
      filter: blur(44px);
      z-index:0;
    }
    
    /* --- TOOL SPECIFIC STYLES --- */
    .tool-form { display: flex; gap: 12px; margin-top: 24px; }
    #keywordInput {
        flex-grow: 1;
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(91,140,255,0.2);
        color: #fff;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 1rem;
        transition: all .2s ease;
    }
    #keywordInput:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(91,140,255,0.1), 0 4px 20px rgba(91,140,255,0.1);
    }
    #generateBtn {
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        border: none;
        color: #fff;
        font-weight: 700;
        padding: 12px 24px;
        border-radius: 10px;
        cursor: pointer;
        transition: all .2s ease;
        box-shadow: 0 6px 20px rgba(91,140,255,0.15);
    }
    #generateBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(91,140,255,0.2); }
    #loader { text-align: center; padding: 40px 0; display: none; }
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.1);
        border-left-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #results { margin-top: 32px; display: none; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    #keywordCount { font-weight: 600; color: var(--muted); }
    #copyAllBtn {
        background: var(--glass-2);
        border: 1px solid rgba(91,140,255,0.15);
        color: var(--accent-2);
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all .2s ease;
    }
    #copyAllBtn:hover { background: rgba(91,140,255,0.15); color: #fff; }
    
    .keyword-category { margin-bottom: 28px; }
    .keyword-category h3 {
        color: var(--accent-2);
        border-bottom: 1px solid rgba(91,140,255,0.1);
        padding-bottom: 8px;
        margin-bottom: 12px;
    }
    .keyword-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        list-style-type: none;
        padding: 0;
    }
    .keyword-list li {
        background: var(--glass);
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        color: #cfe3ff;
        cursor: pointer;
        transition: all .2s ease;
        border: 1px solid transparent;
    }
    .keyword-list li:hover {
        background: var(--glass-2);
        border-color: rgba(91,140,255,0.2);
        transform: translateY(-2px);
    }
    /* --- END TOOL STYLES --- */


    @media (max-width:860px){
      header{ padding:12px 18px; gap:12px; }
      nav { display: none; } /* Hide nav on mobile for tool pages */
      .brand h1{ font-size:1rem; }
      .canvas-wrap{ width:66px; height:66px; border-radius:14px; }
      .card{ padding:20px; border-radius:12px; }
      main{ padding:24px 12px 60px; }
      .tool-form { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce){
      .card, nav a, .spinner { transition: none !important; animation: none !important; }
      canvas { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg-shape" aria-hidden="true"></div>
  <div class="bg-shape-2" aria-hidden="true"></div>

  <header>
    <a href="https://jdiro.com/" class="brand" aria-label="JIRO brand homepage">
      <div class="canvas-wrap" role="img" aria-hidden="false" aria-label="3D JIRO logo">
        <canvas id="logoCanvas" tabindex="-1"></canvas>
      </div>
      <h1><span class="logo-emoji">🛠</span> J1RO</h1>
    </a>
    <nav aria-label="Primary navigation">
      <a href="https://jdiro.com/">Home</a>
      <a href="https://jdiro.com/aboutus.html">About</a>
      <a href="https://jdiro.com/contact-us.html">Contact</a>
      <a href="https://jdiro.com/privacy-policy.html">Privacy</a>
      <a href="https://jdiro.com/terms.html">Terms</a>
      <a class="cta" href="https://jdiro.com/">Get Tools</a>
    </nav>
  </header>

  <main>
    <section class="content" aria-labelledby="tool-title">
      <article class="card" id="tool-card" role="article" tabindex="0" aria-labelledby="tool-title">
        
        <h1 id="tool-title">Keyword Research Tool</h1>
        <p>Enter a seed keyword to generate hundreds of long-tail variations, questions, and other valuable ideas for your content strategy or SEO campaign.</p>

        <form id="keywordForm" class="tool-form">
          <input type="text" id="keywordInput" placeholder="e.g., 'sustainable energy'" required aria-label="Seed Keyword">
          <button type="submit" id="generateBtn">Generate Ideas</button>
        </form>

        <div id="loader">
          <div class="spinner"></div>
        </div>

        <div id="results">
          <div class="results-header">
            <span id="keywordCount">Found 0 keywords</span>
            <button id="copyAllBtn">Copy All</button>
          </div>
          <div id="results-container"></div>
        </div>

      </article>
    </section>
  </main>

  <!-- JS for 3D Logo + Tilt -->
  <script>
    (function(){
      const canvas = document.getElementById('logoCanvas');
      if (!canvas) return;
      function whenThreeReady(cb){
        if (window.THREE) return cb();
        const t = setInterval(()=>{ if(window.THREE){ clearInterval(t); cb(); } }, 50);
        setTimeout(()=>{ clearInterval(t); cb(); }, 3000);
      }
      whenThreeReady(()=> {
        try {
          const THREE = window.THREE;
          const scene = new THREE.Scene();
          const renderer = new THREE.WebGLRenderer({canvas: canvas, alpha:true, antialias:true, powerPreference:'high-performance' });
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1.5, 2));
          renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
          const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
          camera.position.set(0, 0, 3.2);
          const light = new THREE.DirectionalLight(0xffffff, 1.0);
          light.position.set(5,5,5);
          scene.add(light);
          scene.add(new THREE.AmbientLight(0xffffff, 0.35));
          const torusGeo = new THREE.TorusKnotGeometry(0.6, 0.18, 120, 16, 2, 3);
          const mat = new THREE.MeshStandardMaterial({ metalness: 0.6, roughness: 0.25, color: 0x5b8cff, emissive: 0x0a2b7a, emissiveIntensity: 0.6 });
          const torus = new THREE.Mesh(torusGeo, mat);
          scene.add(torus);
          const inner = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32,32), new THREE.MeshStandardMaterial({color:0xeaf4ff, metalness:0.2, roughness:0.3}));
          scene.add(inner);
          function resize(){ const w = canvas.clientWidth||86, h = canvas.clientHeight||86; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
          resize(); new ResizeObserver(resize).observe(canvas);
          let mx=0, my=0;
          window.addEventListener('mousemove', e=>{ const r=canvas.getBoundingClientRect(); mx=((e.clientX-r.left)/r.width-0.5)*2; my=((e.clientY-r.top)/r.height-0.5)*2; }, {passive:true});
          let t=0; function animate(){ t+=0.01; torus.rotation.x+=(-my*0.18-torus.rotation.x)*0.06; torus.rotation.y+=(mx*0.2-torus.rotation.y)*0.06; torus.rotation.z=Math.sin(t*0.6)*0.04; inner.rotation.y+=0.008; renderer.render(scene,camera); requestAnimationFrame(animate);} animate();
        } catch(err){ canvas.style.background="linear-gradient(135deg,#0b1220,#09111a)"; }
      });
    })();
    (function(){
      const card=document.getElementById('tool-card'); if(!card) return; let b=card.getBoundingClientRect(); function update(){b=card.getBoundingClientRect();} window.addEventListener('resize',update,{passive:true});
      card.addEventListener('mousemove',e=>{const px=(e.clientX-b.left)/b.width,py=(e.clientY-b.top)/b.height; card.style.transform=`rotateX(${(py-0.5)*-8}deg) rotateY(${(px-0.5)*12}deg) translateZ(14px)`;});
      card.addEventListener('mouseleave',()=>card.style.transform='rotateX(0deg) rotateY(0deg) translateZ(0px)');
    })();
  </script>
  
  <!-- JS for Keyword Tool -->
  <script>
    const form = document.getElementById('keywordForm');
    const input = document.getElementById('keywordInput');
    const loader = document.getElementById('loader');
    const resultsDiv = document.getElementById('results');
    const resultsContainer = document.getElementById('results-container');
    const keywordCountSpan = document.getElementById('keywordCount');
    const copyAllBtn = document.getElementById('copyAllBtn');

    const modifiers = {
      questions: ["who", "what", "where", "when", "why", "how", "are", "is", "can", "which", "does"],
      prepositions: ["for", "with", "to", "near", "without", "like", "and", "on", "in"],
      comparisons: ["vs", "versus", "or", "alternative to", "like", "better than"],
      alphabetical: "abcdefghijklmnopqrstuvwxyz".split('')
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const seedKeyword = input.value.trim();
      if (!seedKeyword) return;

      resultsDiv.style.display = 'none';
      loader.style.display = 'block';
      resultsContainer.innerHTML = '';
      
      // Simulate processing time for better UX
      setTimeout(() => {
        generateAndDisplayKeywords(seedKeyword);
        loader.style.display = 'none';
        resultsDiv.style.display = 'block';
      }, 600);
    });

    function generateAndDisplayKeywords(seed) {
      let totalKeywords = 0;
      let allKeywordsText = '';

      // Questions
      const questions = modifiers.questions.map(q => `${q} ${seed}`);
      totalKeywords += questions.length;
      allKeywordsText += questions.join('\n') + '\n';
      createCategory('Questions', questions);

      // Prepositions
      const prepositions = modifiers.prepositions.map(p => `${seed} ${p}`);
      totalKeywords += prepositions.length;
      allKeywordsText += prepositions.join('\n') + '\n';
      createCategory('Prepositions', prepositions);

      // Comparisons
      const comparisons = modifiers.comparisons.map(c => `${seed} ${c}`);
      totalKeywords += comparisons.length;
      allKeywordsText += comparisons.join('\n') + '\n';
      createCategory('Comparisons', comparisons);
      
      // Alphabetical
      const alphabetical = modifiers.alphabetical.map(a => `${seed} ${a}`);
      totalKeywords += alphabetical.length;
      allKeywordsText += alphabetical.join('\n') + '\n';
      createCategory('Alphabetical', alphabetical);

      keywordCountSpan.textContent = `Found ${totalKeywords} keywords`;
      
      copyAllBtn.onclick = () => copyToClipboard(allKeywordsText.trim(), copyAllBtn);
    }
    
    function createCategory(title, keywords) {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'keyword-category';

        const h3 = document.createElement('h3');
        h3.textContent = title;
        categoryDiv.appendChild(h3);

        const ul = document.createElement('ul');
        ul.className = 'keyword-list';
        
        keywords.forEach(keyword => {
            const li = document.createElement('li');
            li.textContent = keyword;
            li.title = 'Click to copy';
            li.onclick = () => copyToClipboard(keyword, li);
            ul.appendChild(li);
        });

        categoryDiv.appendChild(ul);
        resultsContainer.appendChild(categoryDiv);
    }

    function copyToClipboard(text, element) {
        if (!navigator.clipboard) {
            alert('Clipboard API not available');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            const originalText = element.textContent;
            element.textContent = 'Copied!';
            element.style.borderColor = 'var(--accent)';
            setTimeout(() => {
                element.textContent = originalText;
                element.style.borderColor = 'transparent';
            }, 1500);
        }).catch(err => {
            console.error('Failed to copy: ', err);
            alert('Failed to copy text.');
        });
    }
  </script>
</body>
</html>
